name: Build Voice Tuner APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

- name: Debug Android SDK setup
  run: |
    echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
    echo "Listando contenido de ANDROID_SDK_ROOT:"
    ls -R "$ANDROID_SDK_ROOT" || echo "ANDROID_SDK_ROOT not set"
    which sdkmanager || echo "sdkmanager not found in PATH"
    if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
      echo "sdkmanager exists at $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
      "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
    else
      echo "sdkmanager not executable at expected location"
    fi
    echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
    which sdkmanager || echo "sdkmanager not found in PATH"
    if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
      SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
    else
      SDKMANAGER="sdkmanager"
    fi
    yes | $SDKMANAGER "platforms;android-33" "build-tools;33.0.0" "platform-tools"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
