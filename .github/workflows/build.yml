
name: Build Voice Tuner APK   # Nombre del workflow

# Se ejecuta cuando hay push a master/main o cuando lo lanzas manualmente
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:          # permite iniciar el workflow manualmente

jobs:
  build:
    runs-on: ubuntu-latest    # entorno de GitHub Actions (Linux)

    steps:
      # 1️⃣ Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instalar JDK 17 (necesario para compilar Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # OpenJDK de Eclipse Temurin
          java-version: '17'

      # 3️⃣ Instalar Gradle 9.9.1 (versión que tu proyecto requiere)
      - name: Install Gradle 9.9.1
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '9.9.1'

      # 4️⃣ Compilar la APK en modo debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5️⃣ Publicar la APK como artefacto del workflow
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
